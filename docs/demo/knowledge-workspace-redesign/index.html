<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>知拾 · 工作台重设计 Demo</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="shell.css" />
  <link rel="stylesheet" href="workspace.css" />
  <link rel="stylesheet" href="components.css" />
  <link rel="stylesheet" href="settings.css" />
  <link rel="stylesheet" href="agent.css" />
  <link rel="stylesheet" href="dialogs.css" />
  <link rel="stylesheet" href="motion.css" />
  <link rel="stylesheet" href="responsive.css" />
</head>
<body data-page="library" data-library-view="cards">
  <a class="skip-link" href="#mainContent">跳到主要内容</a>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-fold" viewBox="0 0 32 32"><path d="m6 6 10 3 10-3v18l-10 3-10-3V6Zm4 5v10l4 1.2V10l-4-1.2V11Zm8-1v12.2l4-1.2V8.8L18 10Z"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 3h6v18H4V3Zm8 2h4v16h-4V5Zm6-2h2v18h-2V3Z"/></symbol>
    <symbol id="i-add" viewBox="0 0 24 24"><path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7V3Z"/></symbol>
    <symbol id="i-subtract" viewBox="0 0 24 24"><path d="M3 10h18v4H3z"/></symbol>
    <symbol id="i-plug" viewBox="0 0 24 24"><path d="M8 2h3v5h2V2h3v5h3v4a7 7 0 0 1-5 6.7V22h-4v-4.3A7 7 0 0 1 5 11V7h3V2Z"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><path d="M3 4h18v16H3V4Zm4 3v10h3V7H7Zm6 0v10h4V7h-4Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="M10 3a7 7 0 1 0 4.4 12.4L20 21l2-2-5.6-5.6A7 7 0 0 0 10 3Zm0 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 5h8v3H4V5Zm13 0h3v3h-3V5Zm-3-2h3v7h-3V3ZM4 16h3v3H4v-3Zm8 0h8v3h-8v-3Zm-5-2h5v7H7v-7Z"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><path d="M3 4h18v16H3V4Zm4 3v3h3V7H7Zm-1 9h12l-4-5-3 4-2-2-3 3Z"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M3 4c4-1 7 0 9 2 2-2 5-3 9-2v15c-4-1-7 0-9 2-2-2-5-3-9-2V4Zm4 4v7c2 0 3 .3 4 1V9c-1-1-2-1-4-1Zm10 0c-2 0-3 .3-4 1v7c1-.7 2-1 4-1V8Z"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2L12 2Zm7 14 .8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m3 4 19 8-19 8 2-6 10-2-10-2-2-6Z"/></symbol>
    <symbol id="i-clip" viewBox="0 0 24 24"><path d="M8 18a5 5 0 0 0 7 0l6-6a7 7 0 0 0-10-10L4 9a5 5 0 1 0 7 7l6-6-2-2-6 6a2 2 0 1 1-3-3l7-7a4 4 0 0 1 6 6l-6 6a2 2 0 0 1-3 0l-2 2Z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M3 3h18v14H9l-6 4V3Zm5 6v3h3V9H8Zm5 0v3h3V9h-3Z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m5 3 7 7 7-7 2 2-7 7 7 7-2 2-7-7-7 7-2-2 7-7-7-7 2-2Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m3 12 3-3 4 4L18 5l3 3-11 11-7-7Z"/></symbol>
    <symbol id="i-warning" viewBox="0 0 24 24"><path d="M12 2 23 21H1L12 2Zm-2 7v6h4V9h-4Zm0 8v3h4v-3h-4Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M7 2h10l1 3h4v3H2V5h4l1-3Zm-2 8h14l-1 12H6L5 10Zm4 2v7h2v-7H9Zm4 0v7h2v-7h-2Z"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m16 2 6 6L10 20l-8 2 2-8L16 2Zm0 5L7 16l1 1 9-9-1-1Z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M3 12 11 4v5h10v6H11v5l-8-8Z"/></symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 1-7 4H1l5-6 5 6H8a5 5 0 1 0 4-1V4Z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><path d="M4 4h16v16H4V4Z"/></symbol>
    <symbol id="i-tool" viewBox="0 0 24 24"><path d="M14 3a6 6 0 0 0-7 8L2 16l6 6 5-5a6 6 0 0 0 8-7l-5 5-4-4 5-5a6 6 0 0 0-3-3Z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2c3 2 6 3 9 3v6c0 6-4 10-9 12C7 21 3 17 3 11V5c3 0 6-1 9-3Zm-1 6v9h3V8h-3Z"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <button class="brand-button" id="brandButton" type="button" aria-label="返回错题库" title="返回错题库">
        <span class="brand-mark"><svg><use href="#i-fold"/></svg></span>
        <span class="brand-copy"><strong>知拾</strong><small>知识工作台</small></span>
      </button>
      <nav class="primary-nav" aria-label="主导航">
        <button class="nav-item active" type="button" data-page-target="library"><svg><use href="#i-library"/></svg><span>错题与知识</span></button>
        <button class="nav-item" type="button" data-page-target="editor"><svg><use href="#i-add"/></svg><span>新增错题</span></button>
        <button class="nav-item" type="button" data-page-target="settings"><svg><use href="#i-plug"/></svg><span>AI 接入</span></button>
      </nav>
      <section class="tree-panel" aria-label="知识树">
        <div class="tree-heading"><span>知识脉络</span><b id="treeCount">12</b></div>
        <label class="tree-search"><svg><use href="#i-search"/></svg><input id="treeSearch" placeholder="搜索学科或知识点" aria-label="搜索知识树" /></label>
        <div class="tree" id="knowledgeTree">
          <button class="tree-node root active" type="button" data-filter="全部知识"><span class="branch-toggle">−</span><b>全部知识</b><em>12</em></button>
          <div class="tree-branch open">
            <button class="tree-node" type="button" data-filter="数学"><span class="branch-toggle">−</span><b>数学</b><em>7</em></button>
            <div class="tree-branch open">
              <button class="tree-node leaf" type="button" data-filter="函数与导数"><span class="leaf-block"></span><b>函数与导数</b><em>4</em></button>
              <button class="tree-node leaf" type="button" data-filter="圆锥曲线"><span class="leaf-block"></span><b>圆锥曲线</b><em>3</em></button>
            </div>
            <button class="tree-node" type="button" data-filter="物理"><span class="branch-toggle">+</span><b>物理</b><em>5</em></button>
            <div class="tree-branch"><button class="tree-node leaf" type="button" data-filter="受力分析"><span class="leaf-block"></span><b>受力分析</b><em>5</em></button></div>
          </div>
        </div>
        <button class="clear-filter" id="clearFilter" type="button">清除筛选</button>
      </section>
      <div class="sidebar-footer">
        <button class="collapse-button" id="sidebarToggle" type="button" aria-expanded="true" aria-label="收起侧栏" title="收起侧栏"><svg><use href="#i-panel"/></svg><span>收起侧栏</span></button>
      </div>
    </aside>

    <div class="stage">
      <header class="topbar">
        <button class="mobile-brand" id="mobileBrand" type="button" aria-label="返回错题库"><svg><use href="#i-fold"/></svg></button>
        <div class="page-context"><small id="pageEyebrow">学习工作台</small><strong id="pageContext">错题与知识</strong></div>
        <span class="demo-badge"><i></i>交互演示</span>
        <button class="button quiet top-action" type="button" data-page-target="editor"><svg><use href="#i-add"/></svg><span>新增错题</span></button>
        <button class="icon-button" id="stateMenuButton" type="button" aria-label="演示页面状态" title="演示页面状态"><svg><use href="#i-sliders"/></svg></button>
      </header>

      <main class="page-stack" id="mainContent">
        <section class="page active" data-page-view="library" aria-label="错题与知识">
          <div class="library-toolbar">
            <label class="search-box"><svg><use href="#i-search"/></svg><input id="cardSearch" placeholder="搜索题目、错因或知识点" aria-label="搜索卡片" /></label>
            <span class="compact-result"><strong id="resultCount">12</strong> 条内容</span>
            <div class="segmented view-tabs" role="tablist" aria-label="内容类型">
              <button class="active" type="button" role="tab" data-library-target="cards">关联错题 <b>12</b></button>
              <button type="button" role="tab" data-library-target="knowledge">知识卡片 <b>5</b></button>
              <button type="button" role="tab" data-library-target="review" id="reviewTab">复习题 <b>0</b></button>
            </div>
          </div>
          <div class="library-content">
            <section class="library-view active" data-library-view="cards">
              <div class="card-grid" id="cardGrid"></div>
              <div class="surface-state" id="surfaceState" hidden></div>
            </section>
            <section class="library-view" data-library-view="knowledge" id="knowledgeView"></section>
            <section class="library-view" data-library-view="review" id="reviewView"></section>
          </div>
        </section>

        <section class="page" data-page-view="editor" aria-labelledby="editorTitle">
          <div class="editor-head"><button class="icon-button" id="editorBack" type="button" aria-label="返回错题库"><svg><use href="#i-back"/></svg></button><div><span class="section-kicker">CARD COMPOSER</span><h1 id="editorTitle">整理一道错题</h1></div><span class="draft-state" id="draftState"><i></i>尚未修改</span><button class="button quiet" id="conflictButton" type="button">演示冲突</button><button class="button primary" id="saveCard" type="button"><svg><use href="#i-check"/></svg><span>保存卡片</span></button></div>
          <div class="editor-layout">
            <div class="editor-canvas">
              <section class="form-section"><header><span>01</span><div><h2>题目材料</h2><p>题目文字与图片至少保留一项。</p></div></header><label class="field"><span>学科</span><input value="数学" aria-label="学科" /></label><label class="field"><span>题目</span><textarea id="questionInput" rows="4" aria-label="题目">已知函数 f(x)=x³−3x，求函数的单调区间。</textarea></label><button class="image-drop" id="imageDrop" type="button"><svg><use href="#i-image"/></svg><span><b>添加题目图片</b><small>点击选择或拖入 PNG、JPG、WebP，最大 15MB</small></span></button><div class="image-preview" id="imagePreview" hidden><div class="mock-problem-image">f(x) = x³ − 3x</div><button class="icon-button" id="removeImage" type="button" aria-label="移除图片"><svg><use href="#i-trash"/></svg></button></div></section>
              <section class="form-section"><header><span>02</span><div><h2>作答与诊断</h2><p>先记录事实，再补充判断。</p></div></header><div class="field-grid"><label class="field"><span>我的答案</span><textarea rows="3">(-∞,-1) 与 (1,+∞)</textarea></label><label class="field"><span>正确答案</span><textarea rows="3">(-∞,-1) 与 (1,+∞) 递增；(-1,1) 递减</textarea></label></div><label class="field"><span>第一处错误</span><input value="遗漏了 (-1,1) 的单调性" /></label><label class="field"><span>错误原因</span><textarea rows="2">只验证了导数为正的区间，没有完整分析符号表。</textarea></label><div class="choice-row" aria-label="错误类型"><button class="choice-pill active" type="button">步骤遗漏</button><button class="choice-pill" type="button">概念混淆</button><button class="choice-pill" type="button">计算错误</button></div></section>
              <section class="form-section"><header><span>03</span><div><h2>知识归档</h2><p>从已有知识树逐级选择，或新建知识点；最多添加 3 个。</p></div></header><div class="knowledge-picker" id="knowledgePicker"><section><strong>学科</strong><div id="subjectOptions"></div></section><section><strong>章节</strong><div id="chapterOptions"></div></section><section><strong>知识点</strong><div id="pointOptions"></div></section></div><div class="selected-knowledge"><span><small>当前路径</small><b id="selectedKnowledgePath"></b></span><button class="button primary" id="addExistingKnowledge" type="button">添加此节点</button></div><div class="tag-editor" id="tagEditor"><span class="topic-tag">导数与单调性<button type="button" aria-label="删除导数与单调性">×</button></span><input id="tagInput" placeholder="或输入新知识点" aria-label="新建知识点" /><button class="button quiet" id="addTag" type="button">新建</button></div><small class="field-message" id="tagMessage">还可添加 2 个知识点</small></section>
            </div>
            <aside class="ai-organizer" id="aiOrganizer"></aside>
          </div>
        </section>

        <section class="page" data-page-view="settings" aria-labelledby="settingsTitle">
          <div class="settings-head"><div><span class="section-kicker">AI CONNECTIONS</span><h1 id="settingsTitle">AI 接入</h1></div><span class="connection-count"><b>2</b> 个服务可用</span></div>
          <div class="settings-layout">
            <aside class="provider-list" id="providerList"></aside>
            <section class="provider-panel" id="providerPanel"></section>
          </div>
        </section>
      </main>
    </div>
  </div>

  <button class="agent-launcher" id="agentLauncher" type="button" aria-label="打开知拾 Agent" aria-expanded="false"><svg><use href="#i-spark"/></svg><span>知拾 Agent</span><i></i></button>
  <aside class="agent-window" id="agentWindow" role="dialog" aria-modal="false" aria-label="知拾 Agent" hidden></aside>
  <div class="popover state-menu" id="stateMenu" hidden><strong>演示页面状态</strong><button type="button" data-surface-state="normal">正常内容</button><button type="button" data-surface-state="loading">加载中</button><button type="button" data-surface-state="empty">暂无卡片</button><button type="button" data-surface-state="error">读取失败</button></div>
  <div class="dialog-layer card-detail-layer" id="cardDetailLayer" hidden></div>
  <div class="dialog-layer" id="imageDialog" hidden></div>
  <div class="dialog-layer" id="confirmDialog" hidden></div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>知拾 · 统一 AI Agent 交互原型</title>
  <link rel="stylesheet" href="workspace.css" />
  <link rel="stylesheet" href="agent.css" />
  <link rel="stylesheet" href="generation-panel.css" />
  <link rel="stylesheet" href="cards.css" />
  <link rel="stylesheet" href="review.css" />
</head>
<body>
  <a class="skip-link" href="#workspace">跳到主要内容</a>

  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-fold" viewBox="0 0 24 24"><path d="M3 4.5 12 7l9-2.5v15L12 22l-9-2.5v-15Zm3 4v8.7l4 1.1V9.6L6 8.5Zm8 1.1v8.7l4-1.1V8.5l-4 1.1Z"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 2 1.5 21h21L12 2Zm-1.5 7h3v6h-3V9Zm0 8h3v3h-3v-3Z"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M3 4c3.8-.9 6.8 0 9 2 2.2-2 5.2-2.9 9-2v15c-3.8-.9-6.8 0-9 2-2.2-2-5.2-2.9-9-2V4Zm4 4v7.2c1.5 0 2.7.3 4 1V9.1C9.7 8.3 8.5 8 7 8Zm10 0c-1.5 0-2.7.3-4 1v7.2c1.3-.7 2.5-1 4-1V8Z"/></symbol>
    <symbol id="i-cards" viewBox="0 0 24 24"><path d="M4 3h16v13H4V3Zm3 3v2h7V6H7Zm0 4v2h10v-2H7Zm-3 8h16v3H4v-3Z"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 2.1 6.9L21 11l-6.9 2.1L12 20l-2.1-6.9L3 11l6.9-2.1L12 2Zm7 14 .8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 1 0 4.6 13.4L20.7 22l1.4-1.4-5.6-5.6A7.5 7.5 0 0 0 10.5 3Zm0 2.5a5 5 0 1 1 0 10 5 5 0 0 1 0-10Z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7-2-2 5-5-5-5 2-2Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m3 12 2.4-2.4 4.1 4.1L18.7 4.5 21 7 9.5 18.5 3 12Z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1.5 5v4.4l3.4 2-1.5 2.5-5-3V7h3Z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M3 3h18v14H9l-6 4V3Zm4 5v2h10V8H7Zm0 4v2h7v-2H7Z"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M4 11h16v2H4v-2Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7V4Z"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m3 4 19 8-19 8 2-6 10-2-10-2-2-6Z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><path d="M5 5h14v14H5V5Z"/></symbol>
    <symbol id="i-tool" viewBox="0 0 24 24"><path d="M14.5 3a6 6 0 0 0-7.1 7.6L2 16l6 6 5.4-5.4A6 6 0 0 0 21 9.5l-4.8 4.8-3.5-3.5L17.5 6A6 6 0 0 0 14.5 3Z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2c2.8 1.8 5.7 2.8 9 3v6c0 5.8-3.8 9.6-9 12-5.2-2.4-9-6.2-9-12V5c3.3-.2 6.2-1.2 9-3Zm-1.2 6v8h2.4V8h-2.4Z"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 5 2 12l7 7v-4h6a5 5 0 0 1 5 5h2a8 8 0 0 0-8-8H9V5Z"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M13 3h8v8h-3V8.1l-7.4 7.5-2.2-2.2L15.9 6H13V3ZM4 5h6v3H7v9h9v-3h3v6H4V5Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M8 3h8l1 2h4v3H3V5h4l1-2Zm-3 7h14l-1 11H6L5 10Z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 1-7.5 5H2l4-5 4 5H7a5 5 0 1 0 5-2V4Z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-1.5 5h3v3h-3V7Zm0 5h3v6h-3v-6Z"/></symbol>
  </svg>

  <div class="prototype-bar" role="region" aria-label="原型控制">
    <div class="prototype-title">
      <span>交互原型</span>
      <strong>统一 AI Agent</strong>
    </div>
    <div class="journey-switcher" role="tablist" aria-label="选择演示旅程">
      <button type="button" role="tab" data-journey="mistakes"><span>01</span>错题整理</button>
      <button type="button" role="tab" data-journey="knowledge"><span>02</span>知识卡片</button>
      <button type="button" role="tab" data-journey="practice"><span>03</span>练习卡片</button>
    </div>
    <div class="prototype-actions">
      <button class="text-button" id="restartButton" type="button"><svg><use href="#i-refresh"/></svg>模拟重启</button>
      <button class="text-button" id="resetButton" type="button"><svg><use href="#i-undo"/></svg>重置旅程</button>
      <a class="contract-link" href="contract-freeze.md"><svg><use href="#i-shield"/></svg>查看合约冻结</a>
    </div>
  </div>

  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand"><span><svg><use href="#i-fold"/></svg></span><div><strong>知拾</strong><small>学习工作台</small></div></div>
      <nav class="main-nav">
        <button type="button" data-page="mistakes"><svg><use href="#i-alert"/></svg><span>错题库</span><b>12</b></button>
        <button type="button" data-page="knowledge"><svg><use href="#i-book"/></svg><span>知识卡片</span><b>8</b></button>
        <button type="button" data-page="practice"><svg><use href="#i-cards"/></svg><span>练习题库</span><b id="practiceCount">24</b></button>
      </nav>
      <section class="sidebar-section">
        <span>当前学习范围</span>
        <button class="scope-row" type="button"><i></i><div><strong>高等数学</strong><small>导数与函数性质</small></div><svg><use href="#i-chevron"/></svg></button>
      </section>
      <div class="sidebar-foot"><span class="provider-dot"></span><div><strong>Codex 已连接</strong><small>本地优先 · 写入需批准</small></div></div>
    </aside>

    <main class="workspace" id="workspace" tabindex="-1">
      <header class="workspace-header">
        <div>
          <span class="eyebrow" id="pageEyebrow">知识卡片 / 最近修改</span>
          <h1 id="pageTitle">知识卡片</h1>
        </div>
        <div class="header-actions">
          <label class="search"><svg><use href="#i-search"/></svg><input aria-label="搜索当前页面" placeholder="搜索当前页面" /></label>
          <button class="agent-entry" id="pageAgentEntry" type="button"><svg><use href="#i-spark"/></svg><span>生成知识卡</span></button>
        </div>
      </header>

      <section class="context-strip" aria-label="页面当前选择">
        <div><span class="context-label">当前视图</span><strong id="pageContextTitle">5 张独立卡片</strong></div>
        <div class="context-chips" id="pageContextChips"></div>
        <small>设置窗与 Agent 平级；卡片选择和提案审核始终在主内容区完成。</small>
      </section>

      <section class="page-canvas" id="pageCanvas" aria-live="polite"></section>
    </main>
  </div>

  <aside class="generation-panel" id="generationPanel" role="dialog" aria-modal="false" aria-labelledby="generationPanelTitle" hidden>
    <header class="generation-header">
      <div class="generation-heading"><span>由当前 Agent 任务管理</span><strong id="generationPanelTitle">练习批次设置</strong><small id="generationPanelSubtitle"></small></div>
      <button class="icon-button" id="generationPanelClose" type="button" aria-label="关闭生成设置"><svg><use href="#i-minus"/></svg></button>
    </header>
    <section class="generation-body" id="generationPanelBody"></section>
  </aside>

  <button class="agent-launcher" id="agentLauncher" type="button" aria-expanded="false" aria-controls="agentWindow">
    <span class="launcher-icon"><svg><use href="#i-spark"/></svg></span>
    <span class="launcher-copy" aria-live="polite" aria-atomic="true"><strong>AI Agent</strong><small id="launcherStatus">准备就绪</small></span>
    <span class="launcher-badge" id="launcherBadge" hidden></span>
  </button>

  <aside class="agent-window" id="agentWindow" role="dialog" aria-modal="false" aria-label="知拾 AI Agent" hidden>
    <header class="agent-header">
      <span class="agent-mark"><svg><use href="#i-spark"/></svg></span>
      <div class="agent-heading"><strong>知拾 Agent</strong><small><i></i><span id="agentRuntimeLabel">Codex · 本地工具</span></small></div>
      <button class="icon-button" id="newConversationButton" type="button" title="新对话" aria-label="创建新对话"><svg><use href="#i-plus"/></svg></button>
      <button class="icon-button" id="minimizeButton" type="button" title="收起" aria-label="收起 Agent"><svg><use href="#i-minus"/></svg></button>
    </header>

    <section class="task-bar" aria-label="当前任务">
      <div><span>当前任务</span><strong id="taskTitle">整理错题</strong></div>
      <span class="task-status" id="taskStatus">草拟中</span>
    </section>

    <ol class="task-progress" id="taskProgress" aria-label="任务进度"></ol>
    <section class="agent-context" id="agentContext"></section>
    <section class="timeline" id="timeline" aria-live="polite"></section>
    <section class="agent-actions" id="agentActions"></section>

    <form class="composer" id="composerForm">
      <label for="composerInput">给 Agent 的消息</label>
      <div class="composer-box">
        <textarea id="composerInput" rows="2" placeholder="描述你想让 Agent 完成的任务"></textarea>
        <button id="sendButton" type="submit" aria-label="发送消息"><svg><use href="#i-send"/></svg></button>
      </div>
      <div class="composer-meta"><span>Enter 发送 · Shift+Enter 换行</span><button id="stopButton" type="button" hidden><svg><use href="#i-stop"/></svg>停止本轮</button></div>
    </form>
  </aside>

  <div class="dialog-backdrop" id="dialogBackdrop" hidden>
    <section class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogDescription">
      <span class="dialog-icon"><svg><use href="#i-alert"/></svg></span>
      <h2 id="dialogTitle">创建新对话？</h2>
      <p id="dialogDescription">当前任务还有未保存的提案。创建新对话会丢弃这些待处理内容。</p>
      <div><button class="button secondary" id="dialogCancel" type="button">继续当前任务</button><button class="button danger" id="dialogConfirm" type="button">丢弃并新建</button></div>
    </section>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite"></div>

  <script defer src="data.js"></script>
  <script defer src="page-views.js"></script>
  <script defer src="knowledge-views.js"></script>
  <script defer src="practice-views.js"></script>
  <script defer src="source-picker.js"></script>
  <script defer src="generation-panel.js"></script>
  <script defer src="agent-views.js"></script>
  <script defer src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知拾 · 知识树学习闭环 Demo</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">知</span><span><strong>知拾</strong><small>ZHISHI</small></span></div>
      <p class="side-label">学习空间</p>
      <button class="side-item active"><span class="side-icon">▤</span>我的错题</button>
      <button class="side-item"><span class="side-icon">＋</span>新增错题</button>
    </aside>
    <main class="main">
      <header class="topbar"><span>错题库</span><b>/</b><span>知识树</span><span class="demo-pill">INTEGRATED DEMO</span></header>
      <div class="content">
        <section class="workspace">
          <aside class="tree-panel">
            <header><h2>知识点目录</h2><p>选到具体知识点即可开始学习</p></header>
            <label class="tree-search" aria-label="搜索知识点">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
              <input id="treeSearch" placeholder="搜索学科、章节或知识点…" />
            </label>
            <ul class="tree-list" id="knowledgeTree"></ul>
          </aside>
          <div class="results">
            <div class="active-filter"><span>当前分类</span><strong id="activePath">全部知识点</strong><button id="clearFilter" type="button" hidden>清除筛选</button></div>
            <div class="result-heading"><h2 id="resultTitle">全部错题</h2><span id="resultMeta"></span></div>
            <div class="view-tabs" role="tablist" aria-label="当前知识点内容">
              <button class="active" data-view="cards" role="tab">关联错题 <span id="cardTabCount"></span></button>
              <button data-view="knowledge" role="tab">知识卡片 <span id="knowledgeTabCount"></span></button>
              <button data-view="review" role="tab">复习题</button>
              <em id="viewHint">知识卡片可按任意树层级检索</em>
            </div>
            <div class="view-content" id="viewContent"></div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="./data.js"></script>
  <script src="./learning.js"></script>
  <script src="./app.js"></script>
</body>
</html>
